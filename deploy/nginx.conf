server {
    listen 80;
    server_name game.4mn.org;
    root /srv/game/current;
    index index.html;
    server_tokens off;

    # Each release reuses Godot's filenames. Revalidate them so an online
    # browser cannot combine an old engine, pack, shell, or service worker.
    add_header Cache-Control "no-cache" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Service-Worker-Allowed "/" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/wasm application/octet-stream application/javascript
               application/json application/manifest+json text/css image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.wasm$ {
        types { application/wasm wasm; }
        try_files $uri =404;
    }

    location ~ \.pck$ {
        types { application/octet-stream pck; }
        try_files $uri =404;
    }
}
