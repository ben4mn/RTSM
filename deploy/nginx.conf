limit_req_zone $binary_remote_addr zone=playtest_uploads:1m rate=3r/s;

server {
    listen 80;
    server_name game.4mn.org;
    root /srv/game/current;
    index index.html;
    server_tokens off;

    # Cloudflare terminates TLS; Godot/PWA APIs require the public HTTPS origin.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://game.4mn.org$request_uri;
    }

    # Godot reuses export filenames across releases. Prevent stale HTTP/CDN
    # assets; the service worker manages the offline cache separately.
    add_header Cache-Control "no-store, max-age=0, must-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Service-Worker-Allowed "/" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/wasm application/octet-stream application/javascript
               application/json application/manifest+json text/css image/svg+xml;

    # Match the installed PWA entry and the stock worker's cached HTML key.
    location = / {
        return 302 https://game.4mn.org/index.html$is_args$args;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /api/playtest-diagnostics {
        limit_except POST { deny all; }
        limit_req zone=playtest_uploads burst=12 nodelay;
        limit_req_status 429;
        client_max_body_size 256k;
        client_body_buffer_size 256k;
        access_log off;
        proxy_pass http://diagnostics:8080/api/playtest-diagnostics;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location ~ \.wasm$ {
        types { application/wasm wasm; }
        try_files $uri =404;
    }

    location ~ \.pck$ {
        types { application/octet-stream pck; }
        try_files $uri =404;
    }
}
