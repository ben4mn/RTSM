<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Original Company forge: offset limewashed chimney, deep ember hearth,
       low enamel roof and broad iron anvil on a timber block. -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M9 106 49 88 121 105 80 125 17 118Z" fill="#263c36" opacity=".22"/>
    <path d="M13 91 53 74 114 89 114 108 73 123 13 109Z" fill="#8c9e82" stroke="#405647" stroke-width="1.6"/>
    <path d="M13 91 73 105 114 89 114 99 73 117 13 103Z" fill="#c4c3a6"/>
    <!-- The forge chimney is masonry, not team paint. A broad dark mouth
         and one warm seam remain legible without smoke or particle noise. -->
    <path d="M23 19 42 23 42 93 23 88Z" fill="#dfd7bb" stroke="#344a43" stroke-width="1.8"/>
    <path d="M42 23 54 17 54 86 42 93Z" fill="#9eaa90" stroke="#344a43" stroke-width="1.5"/>
    <path d="M20 14 35 7 57 12 43 20Z" fill="#c8c6ab" stroke="#344a43" stroke-width="1.6"/>
    <path d="M20 14 43 20 43 27 20 21Z" fill="#e5dcc0" stroke="#344a43" stroke-width="1.3"/>
    <path d="M43 20 57 12 57 19 43 27Z" fill="#899b84" stroke="#344a43" stroke-width="1.3"/>
    <path d="M27 14 36 10 49 13 41 17Z" fill="#33483f"/>
    <path d="M25 33 40 36 M25 48 40 51 M25 63 40 66 M32 35 32 42 M33 52 33 59 M46 33 52 30" stroke="#acb29a" stroke-width="1.2"/>
    <!-- Compact smithy under a low asymmetrical roof. -->
    <path d="M40 58 80 67 80 105 40 96Z" fill="#d9d3b7" stroke="#344a43" stroke-width="1.7"/>
    <path d="M80 67 109 52 109 92 80 105Z" fill="#a1af95" stroke="#344a43" stroke-width="1.5"/>
    <path d="M37 56 65 31 92 37 116 53 80 72Z" fill="#344f4b" stroke="#293d39" stroke-width="1.9"/>
    <path d="M37 56 65 31 92 37 80 65Z" fill="#6c9890"/>
    <path d="M92 37 116 53 80 65Z" fill="#4d7770"/>
    <path d="M38 57 80 66 115 53 113 59 80 73 38 63Z" fill="#527e75"/>
    <path d="M39 57 80 67 114 54 M65 31 92 37" fill="none" stroke="#bed0b2" stroke-width="1.5"/>
    <path d="M51 55 70 37 M66 59 82 40 M98 44 107 51" stroke="#88aaa0" stroke-width="1.2"/>
    <!-- Deep stone hearth: warm material light remains the same for both teams. -->
    <path d="M45 76 49 70 69 75 74 83 74 101 45 94Z" fill="#6d7662" stroke="#465947" stroke-width="1.3"/>
    <path d="M49 78 53 75 66 78 70 84 70 98 49 93Z" fill="#293e36"/>
    <path d="M51 91 54 84 57 88 61 81 65 89 68 87 69 96 51 92Z" fill="#ba7954"/>
    <path d="M55 92 59 87 61 91 64 88 66 95Z" fill="#e2bd7a"/>
    <path d="M43 96 75 103 75 108 43 101Z" fill="#b8b99c" stroke="#637b61" stroke-width="1.2"/>
    <path d="M85 72 102 64 102 80 85 88Z" fill="#304a3e"/>
    <path d="M88 72 88 85 M94 69 94 82 M100 66 100 79" stroke="#788b69" stroke-width="2"/>
    <!-- A wide horn anvil and stump give the role a second unmistakable cue. -->
    <path d="M19 97 28 93 40 96 40 110 30 115 19 111Z" fill="#a49f78" stroke="#4a6049" stroke-width="1.4"/>
    <path d="M30 101 40 97 40 110 30 115Z" fill="#7f8d67"/>
    <path d="M23 103 23 109 M35 104 35 110" stroke="#c6be94" stroke-width="1.1"/>
    <path d="M13 88 24 85 43 89 42 94 33 96 31 101 22 99 23 94 17 92Z" fill="#527168" stroke="#293f38" stroke-width="1.7"/>
    <path d="M13 88 24 85 43 89 32 93 21 91Z" fill="#b6c0a8"/>
    <path d="M23 96 31 98" stroke="#789386" stroke-width="1.3"/>
    <!-- Stock iron and a hammer are large, restrained accents. -->
    <path d="M91 99 104 94 111 96 99 102Z M91 104 104 99 111 101 99 107Z" fill="#6b8374" stroke="#40594b" stroke-width="1.1"/>
    <path d="M97 88 104 76" stroke="#ab9f75" stroke-width="2.5"/>
    <path d="M99 75 106 72 110 76 103 80Z" fill="#c5c8ae" stroke="#3c5748" stroke-width="1.2"/>
    <path d="M18 106 27 108 M78 115 86 111" stroke="#e0d7b8" stroke-width="1"/>
  </g>
</svg>
