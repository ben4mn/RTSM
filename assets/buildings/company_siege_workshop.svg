<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Original Company siege yard: an open assembly shed with a projecting
       timber crane, hanging tackle and a field-sized carriage. -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M6 105 47 86 122 105 80 126 15 118Z" fill="#263c36" opacity=".22"/>
    <path d="M10 90 55 70 118 87 118 108 76 124 10 109Z" fill="#879a7d" stroke="#405647" stroke-width="1.6"/>
    <path d="M10 90 76 105 118 87 118 99 76 118 10 104Z" fill="#c4c4a5"/>
    <!-- One broad roof leaves the assembly floor open, unlike the hall/stable. -->
    <path d="M20 48 70 60 70 104 20 92Z" fill="#d7d1b4" stroke="#344a43" stroke-width="1.6"/>
    <path d="M70 60 102 45 102 91 70 104Z" fill="#9bac90" stroke="#344a43" stroke-width="1.5"/>
    <path d="M26 60 65 69 65 102 26 93Z" fill="#314c40"/>
    <path d="M77 66 97 57 97 91 77 100Z" fill="#4b6650"/>
    <path d="M14 46 43 21 78 23 109 44 70 67Z" fill="#344f4b" stroke="#293d39" stroke-width="1.9"/>
    <path d="M14 46 43 21 78 23 70 60Z" fill="#6c9890"/>
    <path d="M78 23 109 44 70 60Z" fill="#4d7770"/>
    <path d="M14 47 70 61 108 44 107 50 70 68 15 54Z" fill="#527e75"/>
    <path d="M15 47 70 62 108 45 M43 21 78 23" fill="none" stroke="#bed0b2" stroke-width="1.5"/>
    <path d="M29 46 50 27 M46 50 63 29 M61 54 75 31" stroke="#88aaa0" stroke-width="1.2"/>
    <path d="M21 57 26 59 26 94 21 93 M65 67 71 69 71 105 65 103 M97 55 103 52 103 92 97 95" fill="#b5b493" stroke="#637b58" stroke-width="1"/>
    <path d="M27 66 62 95 M29 92 62 73" stroke="#7b8a64" stroke-width="2.2"/>
    <!-- An offset timber jib makes the siege silhouette larger and mechanical. -->
    <path d="M88 22 94 20 94 94 88 97Z" fill="#a69d74" stroke="#415b45" stroke-width="1.6"/>
    <path d="M92 23 115 8 120 13 96 30 80 34 76 29Z" fill="#bcb18a" stroke="#415b45" stroke-width="1.8"/>
    <path d="M94 23 114 11 116 13 95 27Z" fill="#e0d0a6"/>
    <path d="M91 54 113 19 M91 53 79 33" stroke="#71845b" stroke-width="3"/>
    <path d="M115 15 115 50" stroke="#d5c8a0" stroke-width="1.6"/>
    <path d="M111 48 119 46 119 55 115 60 111 57Z" fill="#506c5c" stroke="#2f493c" stroke-width="1.2"/>
    <path d="M115 59 115 65 Q115 70 110 68" fill="none" stroke="#c5c7a9" stroke-width="2.5"/>
    <path d="M86 93 98 88 102 92 90 98Z" fill="#d2c6a1" stroke="#586f50" stroke-width="1"/>
    <!-- A 50 world-pixel carriage matches the deployable field engine. -->
    <g id="workshop-carriage" transform="translate(72 111) scale(.58) translate(-72 -111)">
      <!-- A partly assembled wheeled chassis, not an unrelated military statue. -->
      <path d="M44 88 71 77 100 85 74 98Z" fill="#b6aa80" stroke="#405b45" stroke-width="1.7"/>
      <path d="M44 88 74 95 100 84 100 91 75 103 44 96Z" fill="#8d916a" stroke="#405b45" stroke-width="1.3"/>
      <path d="M52 84 82 91 M62 80 91 87" stroke="#dbcca3" stroke-width="2"/>
      <path d="M58 88 65 70 70 72 67 90 M78 91 83 74 88 76 86 94" fill="#a89f76" stroke="#405b45" stroke-width="1.3"/>
      <path d="M63 72 84 77" stroke="#dbc9a0" stroke-width="3"/>
      <!-- Wheel diameters stay 10–15 world pixels, like the mobile engine. -->
      <g id="workshop-near-wheel" transform="translate(72 104) scale(.45) translate(-72 -104)">
        <!-- The near wheel reads as a broad ring even at the default phone zoom. -->
        <ellipse cx="72" cy="104" rx="13" ry="16" fill="#445e48" stroke="#2d473a" stroke-width="1.6"/>
        <ellipse cx="72" cy="103" rx="9" ry="12" fill="#bfb28a"/>
        <ellipse cx="72" cy="103" rx="6" ry="9" fill="#506b4e"/>
        <path d="M72 92 72 114 M64 98 80 108 M64 108 80 98" stroke="#d0be95" stroke-width="2.1"/>
        <ellipse cx="72" cy="103" rx="3" ry="4" fill="#e0cc9d" stroke="#526b4b" stroke-width="1"/>
      </g>
      <g id="workshop-far-wheel" transform="translate(95 94) scale(.70) translate(-95 -94)">
        <ellipse cx="95" cy="94" rx="6" ry="9" fill="#405b43" stroke="#2e4738" stroke-width="1.3"/>
        <ellipse cx="95" cy="94" rx="3.5" ry="6" fill="#b6a982"/>
        <path d="M95 89 95 99" stroke="#506748" stroke-width="1.5"/>
      </g>
    </g>
    <!-- Stored timber keeps the ground plane practical and uncluttered. -->
    <path d="M15 100 31 94 48 98 33 105Z M15 105 31 99 48 103 33 110Z" fill="#b4aa82" stroke="#536b4b" stroke-width="1.2"/>
    <path d="M22 101 39 105 M29 98 43 102" stroke="#dfcda4" stroke-width="1.2"/>
    <path d="M106 99 115 95 115 107 106 111Z" fill="#547d65" stroke="#405d47" stroke-width="1"/>
    <path d="M109 101 112 100 112 105 109 106Z" fill="#ded1ab"/>
  </g>
</svg>
