    <path d="M12 48 43 22 83 17 117 43 76 70Z" fill="#344f4b" stroke="#293d39" stroke-width="1.8"/>
    <path d="M12 48 43 22 83 17 76 63Z" fill="#6c9890"/>
    <!-- Broad overlapping roof courses: baked facets, no runtime material. -->
    <path d="M43 22 83 17 81.25 28.5 35.25 28.5Z" fill="#88aaa0" opacity=".14"/>
    <path d="M36.09 27.8 81.44 27.26 81.25 28.5 35.25 28.5Z" fill="#344f4b" opacity=".32"/>
    <path d="M43 22 83 17" fill="none" stroke="#bed0b2" stroke-width=".65" opacity=".48"/>
    <path d="M53.8 20.65 47.67 28.5" stroke="#344f4b" stroke-width=".7" opacity=".22"/>
    <path d="M69 18.75 65.15 28.5" stroke="#344f4b" stroke-width=".7" opacity=".22"/>
    <path d="M28.34 34.3 79.69 38.76 79.5 40 27.5 35Z" fill="#344f4b" opacity=".32"/>
    <path d="M35.25 28.5 81.25 28.5" fill="none" stroke="#bed0b2" stroke-width=".65" opacity=".48"/>
    <path d="M55.03 28.5 49.86 37.15" stroke="#344f4b" stroke-width=".7" opacity=".22"/>
    <path d="M72.97 28.5 70.14 39.1" stroke="#344f4b" stroke-width=".7" opacity=".22"/>
    <path d="M27.5 35 79.5 40 77.75 51.5 19.75 41.5Z" fill="#88aaa0" opacity=".14"/>
    <path d="M20.59 40.8 77.94 50.26 77.75 51.5 19.75 41.5Z" fill="#344f4b" opacity=".32"/>
    <path d="M27.5 35 79.5 40" fill="none" stroke="#bed0b2" stroke-width=".65" opacity=".48"/>
    <path d="M41.54 36.35 35.41 44.2" stroke="#344f4b" stroke-width=".7" opacity=".22"/>
    <path d="M61.3 38.25 57.45 48" stroke="#344f4b" stroke-width=".7" opacity=".22"/>
    <path d="M12.84 47.3 76.19 61.76 76 63 12 48Z" fill="#344f4b" opacity=".32"/>
    <path d="M19.75 41.5 77.75 51.5" fill="none" stroke="#bed0b2" stroke-width=".65" opacity=".48"/>
    <path d="M44.69 45.8 39.52 54.45" stroke="#344f4b" stroke-width=".7" opacity=".22"/>
    <path d="M67.31 49.7 64.48 60.3" stroke="#344f4b" stroke-width=".7" opacity=".22"/>
    <path d="M83 17 117 43 76 63Z" fill="#4d7770"/>
    <!-- Broad overlapping roof courses: baked facets, no runtime material. -->
    <path d="M83 17 83 17 91.5 23.5 81.25 28.5Z" fill="#88aaa0" opacity=".14"/>
    <path d="M81.44 27.26 90.58 22.8 91.5 23.5 81.25 28.5Z" fill="#344f4b" opacity=".32"/>
    <path d="M83 17 83 17" fill="none" stroke="#bed0b2" stroke-width=".65" opacity=".48"/>
    <path d="M83 17 84.02 27.15" stroke="#344f4b" stroke-width=".7" opacity=".22"/>
    <path d="M83 17 87.91 25.25" stroke="#344f4b" stroke-width=".7" opacity=".22"/>
    <path d="M79.69 38.76 99.08 29.3 100 30 79.5 40Z" fill="#344f4b" opacity=".32"/>
    <path d="M81.25 28.5 91.5 23.5" fill="none" stroke="#bed0b2" stroke-width=".65" opacity=".48"/>
    <path d="M85.66 26.35 88.31 35.7" stroke="#344f4b" stroke-width=".7" opacity=".22"/>
    <path d="M89.66 24.4 96.31 31.8" stroke="#344f4b" stroke-width=".7" opacity=".22"/>
