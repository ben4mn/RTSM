    <path d="M39 38 44 40 44 47 39 45 M48 40 54 37 54 44 48 47" fill="#71865e"/>
    <!-- Broad timber braces, open bays and the projecting hay loft remain
         the stable's reading; roof materials never turn it into an armory. -->
    <path d="M23 62 32 74 M48 69 41 78 M72 75 65 83 M106 59 98 72" stroke="#8d785b" stroke-width="2.8"/>
    <path d="M34 36 46 40 59 35 59 38 46 43 34 39Z" fill="#4c5742" opacity=".42"/>
