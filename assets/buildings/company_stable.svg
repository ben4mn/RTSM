    <path d="M12 91 58 69 116 86 116 108 73 123 12 110Z" fill="#8c9e82" stroke="#405647" stroke-width="1.5"/>
    <path d="M12 91 73 105 116 86 116 99 73 119 12 106Z" fill="#bfc2a2"/>
    <!-- Open bays remain dark so the horse/rails stand out at small scale. -->
    <path d="M21 50 75 63 75 108 21 95Z" fill="#d6d1b5" stroke="#344a3e" stroke-width="1.7"/>
    <path d="M75 63 109 47 109 93 75 108Z" fill="#9cae92" stroke="#344a3e" stroke-width="1.5"/>
    <path d="M26 60 48 65 48 99 26 94Z M53 67 71 71 71 105 53 101Z" fill="#365146"/>
    <path d="M80 68 103 57 103 90 80 101Z" fill="#47684f"/>
