    <path d="M22 59 27 60 27 96 22 95 M47 65 53 66 53 102 47 101 M70 71 75 72 75 109 70 108 M104 57 109 55 109 93 104 95" fill="#c1c4a3" stroke="#6c805d" stroke-width=".9"/>
