    <path d="M85.03 37.3 86.05 47.45" stroke="#344f4b" stroke-width=".7" opacity=".22"/>
    <path d="M92.83 33.5 97.74 41.75" stroke="#344f4b" stroke-width=".7" opacity=".22"/>
    <path d="M76.19 61.76 116.08 42.3 117 43 76 63Z" fill="#344f4b" opacity=".32"/>
    <path d="M77.75 51.5 108.5 36.5" fill="none" stroke="#bed0b2" stroke-width=".65" opacity=".48"/>
    <path d="M90.97 45.05 93.63 54.4" stroke="#344f4b" stroke-width=".7" opacity=".22"/>
    <path d="M102.97 39.2 109.62 46.6" stroke="#344f4b" stroke-width=".7" opacity=".22"/>
    <path d="M12 49 76 64 117 43 114 49 76 72 13 56Z" fill="#527e75"/>
    <path d="M13 49 76 65 116 44 M43 22 83 17" fill="none" stroke="#bed0b2" stroke-width="1.5"/>
    <path d="M29 49 52 27 M46 53 65 25 M62 57 77 25" stroke="#88aaa0" stroke-width="1.3"/>
    <path d="M33 34 46 24 61 35 46 42Z" fill="#6c9890" stroke="#3a5847" stroke-width="1.2"/>
