<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Original Company archery yard: a fletchery lean-to behind two large
       practice targets; tall curved bow sign marks the open shooting lane. -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M9 106 55 89 121 105 78 125 22 116Z" fill="#263c36" opacity=".22"/>
    <path d="M12 94 60 72 116 89 116 108 73 123 12 109Z" fill="#9ba98a" stroke="#415747" stroke-width="1.4"/>
    <path d="M12 94 73 108 116 89 116 99 73 119 12 106Z" fill="#bdc1a0"/>
    <path d="M17 94 59 75 111 89 73 108Z" fill="#9fab86"/>
    <path d="M24 94 72 104 M34 89 81 99" stroke="#bec39b" stroke-width="2" opacity=".7"/>
    <!-- A back wall and covered bow-making bench frame an open foreground. -->
    <path d="M49 45 86 54 111 41 111 91 86 104 49 94Z" fill="#718b6c" stroke="#354d3f" stroke-width="1.5"/>
    <path d="M49 45 86 54 86 99 49 90Z" fill="#d8d2b4"/>
    <path d="M86 54 111 41 111 88 86 99Z" fill="#9eae8e"/>
    <path d="M54 57 79 63 79 83 54 77Z" fill="#3f5f49"/>
    <path d="M53 79 82 86 82 90 53 83Z" fill="#a9a47c" stroke="#617650" stroke-width="1.1"/>
    <path d="M57 83 57 94 M78 88 78 99" stroke="#7b8d63" stroke-width="2"/>
    <path d="M88 62 92 60 92 96 88 98 M106 52 110 50 110 89 106 91" fill="#5b785a"/>
    <!-- Broad lean-to roof; deliberately one sloping plane instead of a gable. -->
    <path d="M41 43 76 20 118 32 88 60Z" fill="#344f4b" stroke="#293d39" stroke-width="1.8"/>
    <path d="M42 42 76 20 117 32 87 55Z" fill="#729b8c"/>
    <path d="M42 43 87 55 118 32 116 39 88 62 43 50Z" fill="#4d796a"/>
    <path d="M42 43 87 56 117 33 M76 20 117 32" fill="none" stroke="#bcc6a7" stroke-width="1.6"/>
    <path d="M57 43 81 26 M72 48 94 30" stroke="#a6bda6" stroke-width="1.2"/>
    <path d="M46 50 46 95 M87 60 87 103 M113 39 113 88" stroke="#c7c7a5" stroke-width="3"/>
    <path d="M46 57 56 69 M87 67 78 77" stroke="#858f65" stroke-width="2"/>
    <!-- Fletching stock, each bow reads as a curved silhouette rather than text. -->
    <path d="M61 60 Q73 69 61 77 M70 63 Q81 71 70 79" fill="none" stroke="#d1bf8b" stroke-width="2"/>
    <path d="M61 60 61 77 M70 63 70 79" stroke="#a4b08b" stroke-width=".8"/>
    <path d="M95 67 102 63 102 80 95 84Z" fill="#507957"/>
    <path d="M98 68 99 77" stroke="#e1d7ae" stroke-width="1.8"/>
    <!-- Tall bow sign marks the lane, stays recognizable at phone zoom. -->
    <path d="M15 84 Q3 48 29 24" fill="none" stroke="#344d3e" stroke-width="6"/>
    <path d="M15 83 Q4 49 29 25" fill="none" stroke="#d6c494" stroke-width="3.5"/>
    <path d="M15 83 29 25" stroke="#dad6b4" stroke-width="1.2"/>
    <path d="M12 57 31 49" stroke="#5c7654" stroke-width="2.1"/>
    <path d="M31 49 26 48 28 53Z" fill="#d6d2b5" stroke="#496047" stroke-width=".8"/>
    <path d="M15 83 15 107" stroke="#8e9670" stroke-width="3"/>
    <path d="M11 104 19 106" stroke="#566d4b" stroke-width="2"/>
    <!-- Targets are deliberately large: bone discs, teal rings, clay bullseyes. -->
    <path d="M28 87 25 108 M41 89 47 111 M58 91 57 114 M69 92 76 116" stroke="#7c8c63" stroke-width="2.5"/>
    <ellipse cx="34" cy="80" rx="14" ry="19" transform="rotate(-12 34 80)" fill="#e2d7ae" stroke="#536c4b" stroke-width="2"/>
    <ellipse cx="34" cy="80" rx="9" ry="13" transform="rotate(-12 34 80)" fill="#547d65"/>
    <ellipse cx="34" cy="80" rx="5" ry="7.5" transform="rotate(-12 34 80)" fill="#e2d7ae"/>
    <ellipse cx="34" cy="80" rx="2.5" ry="3.8" transform="rotate(-12 34 80)" fill="#a36e50"/>
    <ellipse cx="64" cy="88" rx="11" ry="15" transform="rotate(-12 64 88)" fill="#d2cba2" stroke="#536c4b" stroke-width="1.7"/>
    <ellipse cx="64" cy="88" rx="7" ry="10" transform="rotate(-12 64 88)" fill="#547d65"/>
    <ellipse cx="64" cy="88" rx="3.3" ry="5" transform="rotate(-12 64 88)" fill="#e2d7ae"/>
    <path d="M31 81 43 75 M62 89 73 84" stroke="#d7d1ad" stroke-width="1.3"/>
  </g>
</svg>
