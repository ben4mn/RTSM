<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Original Company architecture: an assembly hall and route lookout.
       Roof planes, timber joints and a sheltered public entrance distinguish
       this civic building without a castle/crown silhouette. -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M5 111 52 91 123 106 78 127 19 122Z" fill="#263c36" opacity=".22"/>
    <!-- Raised stone terrace, warm illuminated face and shaded return. -->
    <path d="M7 104 54 84 121 103 75 125 7 117Z" fill="#778a7c" stroke="#394b45" stroke-width="1.5"/>
    <path d="M7 104 75 112 121 92 121 103 75 125 7 117Z" fill="#a3ac99"/>
    <path d="M7 104 75 112 75 125 7 117Z" fill="#c8c7b0"/>
    <path d="M7 104 53 85 121 92 75 112Z" fill="#ddd7c0"/>
    <path d="M12 110 43 113 M19 116 37 118 M90 111 111 101" fill="none" stroke="#9ba58f" stroke-width="1"/>
    <!-- Central assembly hall: bone limewash over a visible timber frame. -->
    <path d="M19 65 72 77 72 111 19 101Z" fill="#e5dfc9" stroke="#344a43" stroke-width="1.6"/>
    <path d="M72 77 103 61 103 96 72 111Z" fill="#9eb3a1" stroke="#344a43" stroke-width="1.6"/>
    <path d="M19 66 72 78 72 83 19 72Z" fill="#6a7461"/>
    <path d="M23 76 26 76 26 100 23 100 M65 84 68 85 68 108 65 107" fill="#797c64"/>
    <path d="M76 84 79 83 79 106 76 108 M98 73 101 72 101 96 98 98" fill="#557365"/>
    <!-- A long high roof with generous overhang and a crisp copper ridge. -->
    <path d="M12 64 44 36 80 43 111 61 73 82Z" fill="#344f4b" stroke="#293d39" stroke-width="1.8"/>
    <path d="M12 64 44 36 80 43 73 77Z" fill="#6c9890"/>
    <path d="M44 36 80 43 111 61 73 77Z" fill="#4d7770"/>
    <path d="M44 36 80 43" stroke="#b9c8ad" stroke-width="2.2"/>
    <path d="M25 64 49 42 M42 69 57 45 M58 73 67 48 M82 49 99 59" fill="none" stroke="#88aaa0" stroke-width="1" opacity=".7"/>
    <path d="M13 65 73 78 110 61" fill="none" stroke="#a6b6a0" stroke-width="1.4"/>
    <!-- Open porch and route-mark lintel; the opaque central door remains a tap target. -->
    <path d="M38 85 55 88 55 108 38 105Z" fill="#314c45"/>
    <path d="M41 87 48 88 48 106 41 105Z" fill="#6f7c62"/>
    <path d="M48 88 53 89 53 107 48 106Z" fill="#475e4b"/>
    <path d="M47 95 49 95" stroke="#ddcba1" stroke-width="1.3"/>
    <path d="M34 83 58 88 61 83 39 78Z" fill="#587e71" stroke="#344a43" stroke-width="1.4"/>
    <path d="M34 83 34 104 M58 88 58 109" stroke="#e8dec3" stroke-width="2.8"/>
    <path d="M34 84 34 104 M58 89 58 109" stroke="#b9b59d" stroke-width="1"/>
    <path d="M35 108 57 112 57 116 35 112Z" fill="#b3b8a1"/>
    <path d="M31 112 57 117 62 114 62 118 57 121 31 116Z" fill="#dad6be" stroke="#7e907e" stroke-width=".8"/>
    <path d="M45 80 48 81 48 85 45 84Z" fill="#e1d3ad"/>
    <!-- Deep windows, one lit civic lantern, and restrained masonry seams. -->
    <path d="M28 80 32 81 32 89 28 88 M60 86 64 87 64 95 60 94" fill="#557361"/>
    <path d="M84 85 89 83 89 91 84 93 M94 80 98 78 98 86 94 88" fill="#3c5d50"/>
    <path d="M23 93 32 95 M24 97 34 99 M81 101 91 96" stroke="#bcc3ab" stroke-width="1"/>
    <path d="M30 91 33 92 33 97 30 96Z" fill="#d6ad70" stroke="#566752" stroke-width=".8"/>
    <!-- Lookout tower is a timber-framed route office, not a battlement. -->
    <path d="M92 52 107 56 107 101 92 108Z" fill="#d2d4bc" stroke="#344a43" stroke-width="1.5"/>
    <path d="M107 56 119 49 119 94 107 101Z" fill="#90a797" stroke="#344a43" stroke-width="1.5"/>
    <path d="M95 63 104 65 104 81 95 79Z" fill="#34554b"/>
    <path d="M110 63 116 60 116 76 110 79Z" fill="#29473f"/>
    <path d="M99 65 99 80 M113 62 113 77" stroke="#bbc5ac" stroke-width="1.5"/>
    <path d="M92 83 107 87 119 80 119 85 107 92 92 88Z" fill="#6a8068"/>
    <path d="M97 91 104 93 104 101 97 103Z" fill="#6d8974"/>
    <path d="M88 52 103 32 123 48 107 59Z" fill="#527e75" stroke="#293d39" stroke-width="1.6"/>
    <path d="M88 52 103 32 107 55Z" fill="#8bb0a1"/>
    <path d="M89 52 107 56 122 48" fill="none" stroke="#bed0b2" stroke-width="1.2"/>
    <!-- The company route flag echoes the Warrior's shield. -->
    <path d="M103 33 103 16" stroke="#4e6253" stroke-width="1.8"/>
    <path d="M104 17 119 19 115 24 119 28 104 26Z" fill="#e5dcc0" stroke="#788f79" stroke-width=".8"/>
    <path d="M107 20 110 20 110 23 114 23" fill="none" stroke="#547d70" stroke-width="1.5"/>
    <path d="M101 15 105 15" stroke="#c1b68e" stroke-width="1.5"/>
  </g>
</svg>
